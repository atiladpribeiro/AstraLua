name: AstraLua Linux

on:
  push:
    branches: [main]
    paths: ['.github/workflows/astralua-linux.yml', 'CMakeLists.txt', 'src/**', 'builtin/**', 'clientmods/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gettext \
            libsqlite3-dev libgmp-dev libleveldb-dev libcurl4-openssl-dev libzstd-dev \
            libssl-dev libpng-dev libjpeg-dev libgl1-mesa-dev libsdl2-dev \
            libfreetype-dev libogg-dev libvorbis-dev libopenal-dev libluajit-5.1-dev
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRUN_IN_PLACE=ON \
            -DBUILD_SERVER=OFF -DBUILD_UNITTESTS=ON -DENABLE_LTO=OFF \
            -DENABLE_POSTGRESQL=OFF -DENABLE_REDIS=OFF
          cmake --build build --parallel 2
      - name: Testes unitários
        run: |
          test -x ./bin/astralua || test -x ./bin/cloakv4
          bin=$(test -x ./bin/astralua && echo ./bin/astralua || echo ./bin/cloakv4)
          "$bin" --run-unittests --logfile unit-tests.log
      - name: Verificar inicialização e dados do usuário
        run: |
          test -x ./bin/astralua || test -x ./bin/cloakv4
          bin=$(test -x ./bin/astralua && echo ./bin/astralua || echo ./bin/cloakv4)
          "$bin" --version
          grep -q 'AstraLua' CMakeLists.txt
          grep -q 'vibe coding' README.md
      - name: Publicar registros
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astralua-testes
          path: unit-tests.log
          if-no-files-found: warn
